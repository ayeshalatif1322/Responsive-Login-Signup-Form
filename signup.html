<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Responsive Signup Form</title>
        <link rel="stylesheet" href="stylesignup.css">
    </head>
<body>
    <div class="signupform">
    <h2>Signup Form</h2>
    <div class="input-row">
        <label for="firstname">First Name:</label>
        <input type="text" name="myname" id="firstname" placeholder="Firstname" ><br>
    </div>
        <div class="input-row">
        <label for="lastname">Last Name:</label>
        <input type="text" name="myname" id="lastname" placeholder="Lastname"><br>       
    </div>
        <div class="input-row">
        <label>Email:</label>
        <input type="email" name="email" placeholder="Email"><br>
    </div>
    <div class="input-row">
        <label>Phone no.:</label>
        <input type="tel" name="phone" placeholder= "+92XX XXXXXXX"><br>
    </div>
    <div class="input-row">
        <label>Create Password:</label>
        <input type="password" placeholder="Password"><br>
    </div>
    <div class="input-row">
        <label>Confirm Password:</label>
        <input type="password" placeholder="Confirm Password"><br>
    </div>
    <div class="input-row">
        <label>Date of Birth:</label>
        <input type="date" name="dateofbirth" id="dateofbirth" placeholder="DOB">
    </div>
   
   <div class="gender-section">
    <span class="gender-title"></span>Gender:
     <input type="radio" name="gender" value="Female">Female
     <input type="radio" name="gender" value="male">Male <br>
    </div>
    <div class="terms-section">
    <input type="checkbox" name="terms" value="agree">
    <span>I agree with terms and conditions.</span> 
    </div>
    <button class="signup-btn">Signup</button><br>
    <p class="login-redirect">
        Already have an account? <a href="index.html">Login </a>
    </p>
     </div>
</body>
    </html>
